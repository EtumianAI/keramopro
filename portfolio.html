<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Услуги | STONE TOWN</title>
    <meta name="description" content="Перечень услуг по изготовлению изделий из керамогранита.">

    <!-- Подключение стилей (пути такие же, как в index.html) -->
    <link rel="stylesheet" href="./style2/style.css">
</head>

<body>

    <!-- Шапка с навигацией -->
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo">
                <span class="logo__title">STONE TOWN</span>
                <span class="logo__subtitle">Проекты для комфортной жизни</span>
            </a>


            <!-- Бургер кнопка -->
            <div class="burger-container">
                <button class="burger" aria-label="Открыть меню" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <nav class="nav">
                    <a href="index.html" class="nav__link">Главная</a>
                    <a href="services.html" class="nav__link">Услуги</a>
                    <a href="maintenance.html" class="nav__link">Производство</a>
                    <a href="aboutus.html" class="nav__link">О нас</a>
                    <a href="portfolio.html" class="nav__link active">Работы</a>
                    <a href="contacts.html" class="nav__link">Контакты</a>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <!-- === СЕКЦИЯ ПОРТФОЛИО === -->
        <section class="portfolio-section">
            <div class="container">
                <h2>Наши работы</h2>
                <p class="section-subtitle">Более 200 реализованных проектов</p>

                <!-- Сюда JavaScript вставит карточки -->
                <div class="portfolio-grid" id="portfolio-grid"></div>
            </div>
        </section>

        <div class="lightbox-portfolio" id="lightbox-portfolio" hidden>
            <button class="lightbox-portfolio__close" type="button" aria-label="Закрыть">×</button>
            <button class="lightbox-portfolio__nav lightbox-portfolio__nav--prev" type="button"
                aria-label="Предыдущее">‹</button>
            <button class="lightbox-portfolio__nav lightbox-portfolio__nav--next" type="button"
                aria-label="Следующее">›</button>

            <img class="lightbox-portfolio__image" src="" alt="Фото работы">
            <div class="lightbox-portfolio__counter"></div>
        </div>

        <div class="portfolio-grid" id="portfolio-grid"></div>
        
        <!-- Кнопка "Показать ещё" -->
        <div class="portfolio-load-more">
            <button id="load-more-btn" class="btn btn--primary" type="button">Показать ещё</button>
        </div>
    </main>


    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 STONE TOWN. Все права защищены.</p>
        </div>
    </footer>
    <button class="scroll-up-button" aria-label="Вернуться наверх" title="Наверх"><span
            aria-hidden="true">↑</span></button>
    <!-- Скрипты -->
    <script src="js/animations.js" defer></script>
    <script src="js/menuButton.js" defer></script>
    <script src="js/scroll-up-button.js" defer></script>
    <script src="js/header-scroll.js" defer></script>
    <script src="js/portfolio.js" defer></script>

</body>

</html>
